<svg viewBox="368 1023 1186 948" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<style>
/* Initial hidden state */
.space-illustration .base-rect,
.space-illustration .object-rect,
.space-illustration .draw-line {
    opacity: 0;
}

/* Phase 1: Base structures fade in quickly */
.space-illustration.active .base-rect {
    opacity: 0;
    animation: fadeInBase 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes fadeInBase {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Phase 2: Smaller objects appear one by one with a bouncy scale-up */
.space-illustration.active .object-rect {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: fadeInObject 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes fadeInObject {
    0% {
        opacity: 0;
        transform: scale(0.6);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

.space-illustration.active .obj-1 { animation-delay: 0.5s; }
.space-illustration.active .obj-2 { animation-delay: 0.62s; }
.space-illustration.active .obj-3 { animation-delay: 0.74s; }
.space-illustration.active .obj-4 { animation-delay: 0.86s; }
.space-illustration.active .obj-5 { animation-delay: 0.98s; }
.space-illustration.active .obj-6 { animation-delay: 1.1s; }
.space-illustration.active .obj-7 { animation-delay: 1.22s; }
.space-illustration.active .obj-8 { animation-delay: 1.34s; }
.space-illustration.active .obj-9 { animation-delay: 1.46s; }
.space-illustration.active .obj-10 { animation-delay: 1.58s; }

/* Phase 3: Grid lines draw in */
.space-illustration.active .draw-line {
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    opacity: 0;
    animation: drawAndFade 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes drawAndFade {
    0% {
        stroke-dashoffset: 600;
        opacity: 0;
    }
    30% {
        opacity: 0.15;
    }
    100% {
        stroke-dashoffset: 0;
        opacity: 1;
    }
}

/* Staggered delay for drawing lines */
.space-illustration.active .line-1 { animation-delay: 1.1s; }
.space-illustration.active .line-2 { animation-delay: 1.25s; }
.space-illustration.active .line-3 { animation-delay: 1.4s; }
.space-illustration.active .line-4 { animation-delay: 1.55s; }
.space-illustration.active .line-5 { animation-delay: 1.7s; }
.space-illustration.active .line-6 { animation-delay: 1.85s; }
.space-illustration.active .line-7 { animation-delay: 2.0s; }
.space-illustration.active .line-8 { animation-delay: 2.15s; }
.space-illustration.active .line-9 { animation-delay: 2.3s; }
.space-illustration.active .line-10 { animation-delay: 2.45s; }
.space-illustration.active .line-11 { animation-delay: 2.7s; }
</style>




